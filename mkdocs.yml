site_name: Oracle Database Production Engineering Playbook
site_description: >-
  A sequential, zero-to-architect study path for Oracle Database (19c to 26ai):
  relational theory, SQL, PL/SQL, architecture, performance, HA/DR, security and
  the complete FreshMart grocery application.
site_url: https://khiruashish.github.io/oracle-db-playbook/
site_author: Oracle DB Playbook contributors
repo_url: https://github.com/khiruashish/oracle-db-playbook
repo_name: khiruashish/oracle-db-playbook
edit_uri: edit/main/docs/
copyright: Content licensed under the MIT License. Oracle is a registered trademark of Oracle and/or its affiliates.
strict: true

theme:
  name: material
  language: en
  icon:
    logo: material/database
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

plugins:
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  playbook_version: "1.0.0"
  oracle_baseline: "Oracle AI Database 26ai (23.26.x), with 19c / 21c / 23ai differences noted"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/khiruashish/oracle-db-playbook
  generator: true

extra_css:
  - assets/extra.css

